version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: delay_erp
    ports:
      - "5432:5432"
    volumes:
      - delay_erp_postgres_data:/var/lib/postgresql/data

volumes:
  delay_erp_postgres_data:
